<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>tiltr</title>
  <meta name="description" content="Steuere einen Ball per Neigung durch ein unsichtbares Labyrinth – die Welt offenbart sich durch Klang, Vibration und Licht.">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 'black', NICHT 'black-translucent': iOS bemisst den Standalone-Container
       bei translucent "Screen minus Statusbar", verankert ihn aber oben AM
       Screenrand – unten fehlt dann genau Statusbarhöhe (schwarzer Balken,
       auf dem Gerät per Diagnose belegt: in 812 / lvh 874 / env oben 62).
       Mit 'black' stimmen Größe und Position überein; die schwarze Bar
       verschmilzt mit dem dunklen Theme. Wird bei der Installation
       eingebrannt (Änderung = neu zum Home-Bildschirm hinzufügen). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    /* Nur Layout & Screen-Struktur – Tokens/Komponenten: src/ui/theme.css,
       Guideline: docs/DESIGN.md */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      /* Spielfeld-Ton als Grundfarbe: Falls die Plattform (installierte PWA,
         Rotation, Overscroll) irgendwo einen Streifen neben dem Canvas zeigt,
         ist er dunkel wie das Spielfeld – Screens bringen ihr eigenes --bg mit. */
      background: var(--bg-deep, #05070f);
      color: var(--text, #cfd8ea);
      font-family: var(--font, system-ui, sans-serif);
      touch-action: pan-x pan-y;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    /* width/height nötig: Canvas ist ein replaced element und streckt sich
       mit inset:0 allein NICHT; 100% bemisst sich bei fixed am Layout-Viewport. */
    #game { position: fixed; inset: 0; width: 100%; height: var(--app-height, 100%); display: block; touch-action: none; background: var(--bg-deep, #05070f); }

    #hud {
      position: fixed;
      top: var(--safe-top);
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-2) var(--space-3);
      pointer-events: none;
      font-size: var(--fs-body-s);
      opacity: 0.8;
    }
    #hud .btn { pointer-events: auto; margin-left: var(--space-2); }
    #hudStats { display: flex; align-items: center; gap: var(--space-2); min-width: 0; overflow: hidden; }
    #hudButtons { flex-shrink: 0; white-space: nowrap; }
    /* Timer breit genug für "999.9 s": die laufende Zeit schiebt nichts herum. */
    #timer { min-width: 4.6em; font-weight: 700; }
    #floor { color: var(--accent-2); }
    #pings { color: var(--accent); letter-spacing: 3px; padding-right: calc(10px - 3px); }
    #gems { color: var(--warning); }
    /* Meldungen (Checkpoint, Sturz, MP-Status …): eigene ruhige Zeile unterm HUD. */
    #status {
      position: fixed;
      top: calc(var(--safe-top) + 62px);
      left: var(--space-4);
      right: var(--space-4);
      text-align: center;
      font-size: var(--fs-body-s);
      opacity: 0.85;
      pointer-events: none;
    }

    /* Konfetti-Ebene: liegt zwischen Spielfeld und allen Panels. Kein
       Transform, keine Interaktion – nur Papier. */
    #confetti {
      position: fixed; inset: 0;
      /* width/height EXPLIZIT wie bei #game: Ein <canvas> ist ein replaced
         element und streckt sich mit `inset: 0` allein NICHT – es nimmt sein
         Eigenverhältnis 300×150 an (bei 400 px Breite also 200 px hoch, siehe
         docs/DESIGN.md „Keine Höhenangaben für App-Flächen"). Genau das ließ
         die erste Fassung in einem 200 px hohen Streifen feuern: Das Konfetti
         war nach 200 ms oben aus dem „Bild". */
      width: 100%;
      height: var(--app-height, 100%);
      display: block;
      pointer-events: none;
      z-index: calc(var(--z-overlay) - 1);
    }

    /* --- Splash: einmalige Intro-Animation beim Laden (docs/DESIGN.md) ---
       Choreografie in drei Akten, Zeiten in src/ui/splash.ts gespiegelt:
         1. EINROLLEN  – die Kugel kommt von UNTEN in die Bühne (0–650ms),
            danach pingt der erste Echo-Ring: „sie ist da".
         2. TITEL      – Logo, Credit und Version blenden gestaffelt ein und
            bleiben kurz stehen.
         3. ABROLLEN   – die Kugel rollt nach OBEN aus dem Bild, der Splash
            wird durchsichtig, und GLEICHZEITIG fährt der Startscreen von
            unten herein (der Menü-Transform lebt unter body.splashing,
            damit ?nosplash und reduced-motion nichts davon sehen). */
    #splash {
      position: fixed; inset: 0;
      height: var(--app-height, auto);
      z-index: var(--z-splash);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      transition: opacity 500ms ease-out;
    }
    /* Der Grund liegt als EIGENE Ebene darunter: Ein Gradient lässt sich
       nicht auf `none` animieren, eine Opazität schon. Akt 3 macht ihn frei,
       damit das einfahrende Menü (z-index darunter) sichtbar wird – die
       Kugel bleibt als Kind darüber. */
    #splash::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 44%, var(--bg-raised) 0%, var(--bg) 72%);
    }
    #splash.leave { pointer-events: none; }
    #splash.leave::before { animation: splash-bg-out 420ms ease-out both; }
    @keyframes splash-bg-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    #splash.fade { opacity: 0; pointer-events: none; }
    .splash-stage { position: relative; width: 120px; height: 56px; }
    .splash-ball {
      position: absolute; top: 50%; left: 50%;
      width: 18px; height: 18px; margin: -9px 0 0 -9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: var(--glow-accent);
      animation: splash-roll-in 850ms ease-out both;
    }
    /* Glanzpunkt: Ohne Marke ist die Drehung einer einfarbigen Kugel
       unsichtbar – erst er macht aus dem Schieben ein ROLLEN. */
    .splash-ball::after {
      content: '';
      position: absolute; top: 2.5px; left: 5px;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
    }
    /* Ausnahme zur ease-out-Regel (docs/DESIGN.md): Der Auslauf
       BESCHLEUNIGT weg (ease-in) – die Kugel bremst nicht, sie rollt davon. */
    #splash.leave .splash-ball { animation: splash-roll-out 420ms cubic-bezier(0.45, 0, 0.9, 0.55) both; }
    .splash-ring {
      position: absolute; top: 50%; left: 50%;
      width: 18px; height: 18px; margin: -9px 0 0 -9px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      /* `forwards`, NICHT `both`: Mit `both` gilt schon während der
         Verzögerung der from-Zustand (scale 1, opacity 0.9) – der Ring stand
         dann als Umriss auf der Bühne, während die Kugel noch unterwegs war,
         und beides zusammen sah wie eine Pille aus. */
      animation: splash-ping 1100ms ease-out forwards;
    }
    .splash-ring.r1 { animation-delay: 800ms; }
    .splash-ring.r2 { animation-delay: 1300ms; border-color: var(--accent-2); }
    #splash.leave .splash-ring { animation: none; opacity: 0; }
    /* 1,5 Umdrehungen auf dem Weg: Genug, dass der Glanzpunkt das ROLLEN
       erzählt, wenig genug, dass es nicht flimmert (echtes Abrollen wären
       bei r=9px fast acht Umdrehungen). Ein- und Auslauf drehen in DIESELBE
       Richtung – die Kugel setzt ihren Weg fort, sie kehrt nicht um. */
    @keyframes splash-roll-in {
      from { transform: translateY(56vh) rotate(-540deg); opacity: 0; }
      20% { opacity: 1; }
      to { transform: translateY(0) rotate(0deg); opacity: 1; }
    }
    @keyframes splash-roll-out {
      from { transform: translateY(0) rotate(0deg); opacity: 1; }
      70% { opacity: 1; }
      to { transform: translateY(-56vh) rotate(420deg); opacity: 0; }
    }
    @keyframes splash-ping {
      from { transform: scale(1); opacity: 0.9; }
      to { transform: scale(7); opacity: 0; }
    }
    .splash-logo {
      font-size: var(--fs-display);
      letter-spacing: 3px;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: splash-in 550ms ease-out 850ms both;
    }
    #splashCredit { font-size: var(--fs-body-s); opacity: 0.7; animation: splash-in 550ms ease-out 1100ms both; }
    #splashVersion { font-size: var(--fs-caption); opacity: 0.4; animation: splash-in 550ms ease-out 1300ms both; }
    /* Die Schrift räumt ZUERST, und zwar zügig: Der Startscreen trägt selbst
       ein „tiltr" – überlappen beide, sieht es wie eine Doppelbelichtung aus
       (genau das zeigte die erste Fassung). Deshalb 160 ms Schrift raus,
       danach fährt das Menü los. */
    #splash.leave .splash-logo,
    #splash.leave #splashCredit,
    #splash.leave #splashVersion { animation: splash-out 160ms ease-out both; }
    @keyframes splash-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes splash-out {
      from { opacity: 1; transform: none; }
      to { opacity: 0; transform: translateY(-10px); }
    }
    /* Der Startscreen wartet unter dem Bildrand – NUR solange der Splash
       läuft. Ohne diese Klasse (?nosplash, nach dem Splash) hat #overlay
       keinen Transform und verhält sich wie immer. */
    body.splashing #overlay { transform: translateY(100%); }
    /* Die Fahrt ist BEWUSST langsamer als eine Standard-Panel-Animation und
       bremst am Ende deutlich aus: Die Geschwindigkeitsspitze liegt bei ~150 ms
       (die Kurve zieht erst an, statt vom ersten Frame an zu schießen), und die
       letzten 10 % des Weges brauchen ~320 ms – die halbe Animation ist Bremse.
       Zum Vergleich die erste Fassung (460 ms, cubic-bezier(0.16,0.84,0.3,1)):
       Spitze 8900 px/s im ersten Frame, nach 17 % der Zeit schon 61 % des Wegs
       – das schnappte herein statt einzufahren. */
    body.splash-leaving #overlay { animation: menu-rise 640ms cubic-bezier(0.38, 0.62, 0.2, 1) 160ms both; }
    @keyframes menu-rise {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash * { animation: none !important; }
      .splash-ball { transform: none; }
      /* Kein Einfahren: Das Menü steht von Anfang an, wo es hingehört. */
      body.splashing #overlay,
      body.splash-leaving #overlay { transform: none; animation: none; }
    }

    /* --- Startscreen --- */
    #overlay {
      position: fixed; inset: 0;
      height: var(--app-height, auto);
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Zentriert über Auto-Margins statt justify-content: bei Überlauf
         (Querformat) bleibt der Anfang scrollbar statt abgeschnitten. */
      gap: var(--space-4);
      background: radial-gradient(circle at 50% 40%, var(--bg-raised) 0%, var(--bg) 70%);
      text-align: center;
      padding: calc(var(--safe-top) + var(--space-5)) var(--space-5) calc(var(--safe-bottom) + var(--space-5));
      overflow-y: auto;
      touch-action: pan-y;
      z-index: var(--z-overlay);
    }
    #overlay::before, #overlay::after { content: ''; margin: auto; }
    #overlay h1 {
      font-size: var(--fs-display);
      letter-spacing: 3px;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #tagline { max-width: 420px; line-height: 1.45; font-size: var(--fs-body); opacity: 0.85; }
    #headphones { font-size: var(--fs-body-s); opacity: 0.6; }
    #sensorNote { font-size: var(--fs-small); opacity: 0.55; line-height: 1.5; }
    #menuButtons {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--space-3);
      width: min(100%, 360px);
    }
    #quickGroup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-4);
    }
    #presetRow { display: flex; gap: var(--space-2); }
    #modeList { display: flex; flex-direction: column; gap: var(--space-2); }
    /* Tablet (ab 900px, gleicher Breakpoint wie der Editor-Dreispalter):
       Die Phone-Säule verschenkt hier Platz – Mitte verbreitern, Modus-
       Karten zweispaltig, Schnellstart als Querzeile. So passt der ganze
       Startscreen auch im Querformat (1024x768) ohne Scrollen. */
    @media (min-width: 900px) {
      #menuButtons { width: min(100%, 720px); }
      #quickGroup {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
      #quickBest { flex-basis: 100%; }
      #modeList {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .menu-label { font-size: var(--fs-caption); opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
    .menu-meta { font-size: var(--fs-small); opacity: 0.55; min-height: 1.2em; }
    #menuFooter {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
    }
    #langRow { display: flex; gap: var(--space-2); }
    #controlsRow { display: flex; gap: var(--space-2); }
    /* Footer einzeilig ab Tablet: Name, Steuerung und Sprache nebeneinander –
       der ganze Startscreen muss auf ein Querformat-Tablet OHNE Scrollen
       passen (der E2E-Tablet-Lauf misst genau das). Steht NACH der
       Basisregel: gleiche Spezifität, später gewinnt. */
    @media (min-width: 900px) {
      #menuFooter {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
    }
    /* Anzeigename für Duell-Links: leise, optional, nie im Weg. */
    #playerName {
      width: min(100%, 240px);
      background: var(--bg-panel); border: var(--border-strong); color: var(--text);
      border-radius: var(--radius-m); min-height: var(--touch-min);
      padding: 0 var(--space-3); font: 500 var(--fs-body-s) var(--font); text-align: center;
    }
    #version { font-size: var(--fs-caption); opacity: 0.4; }

    #interstitial {
      position: fixed; inset: 0;
      height: var(--app-height, auto);
      display: flex;
      background: rgba(5, 7, 15, 0.72);
      padding: var(--space-5);
      overflow-y: auto;
      touch-action: pan-y;
      z-index: var(--z-overlay);
    }
    .inter-card {
      max-width: 420px;
      width: 100%;
      margin: auto; /* zentriert, bleibt bei Überlauf aber scrollbar */
      text-align: center;
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      background: var(--bg-raised);
    }
    .inter-card h2 { font-size: var(--fs-h2); }
    .inter-card p { font-size: var(--fs-body); line-height: 1.55; opacity: 0.9; white-space: pre-line; }
    .inter-buttons { display: flex; justify-content: center; gap: var(--space-3); margin-top: var(--space-2); }

    #banners {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--safe-bottom) + var(--space-4) - var(--vp-gap, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      width: min(92vw, 440px);
      z-index: var(--z-banner);
      pointer-events: none;
    }
    #banners > .banner { pointer-events: auto; }
    .banner-buttons { display: flex; align-items: center; gap: var(--space-2); }

    #gallery, #campaign, #hearing {
      position: fixed; inset: 0;
      height: var(--app-height, auto);
      z-index: var(--z-panel);
      background: var(--bg);
      overflow-y: auto;
      padding: calc(var(--safe-top) + var(--space-4)) var(--space-4) calc(var(--safe-bottom) + var(--space-4));
      touch-action: pan-y;
    }
    #gallery header, #campaign header, #hearing header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 560px;
      margin: 0 auto var(--space-3);
    }
    #gallery h2, #campaign h2, #hearing h2 { font-size: var(--fs-h2); }
    .world-header { font-size: var(--fs-body); opacity: 0.6; margin-top: var(--space-3); font-weight: 600; }
    #campaign h2 span { font-size: var(--fs-small); opacity: 0.6; }
    #galleryList, #campaignList { max-width: 560px; margin: 0 auto; display: grid; gap: var(--space-3); }
    .level-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-3);
      color: var(--text);
      font-size: var(--fs-body);
      text-align: left;
      min-height: var(--touch-min);
      cursor: pointer;
    }
    .level-item.locked { opacity: 0.45; cursor: default; }

    /* Hörtest: Kompassrose als 3×3-Raster – die Mitte wiederholt den Ping,
       die acht Zellen liegen dort, wo die Richtung klingt (oben = vorn). */
    #hearContent { max-width: 560px; margin: 0 auto; display: grid; gap: var(--space-4); justify-items: center; }
    #hearIntro { font-size: var(--fs-body-s); opacity: 0.7; text-align: center; max-width: 42ch; }
    #hearStatus { font-size: var(--fs-body); min-height: calc(var(--fs-body) * 2.4); text-align: center; }
    #hearGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-2);
      width: min(84vw, 320px);
    }
    .hear-cell {
      aspect-ratio: 1;
      min-height: var(--touch-min);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-h2);
      padding: 0;
    }
    #hearRepeat { border: var(--border-accent); color: var(--accent); }
    #hearResult { display: grid; gap: var(--space-2); font-size: var(--fs-body-s); text-align: center; max-width: 42ch; }
    #hearResult p:last-child { opacity: 0.7; }
    #mp { position: fixed; inset: 0; height: var(--app-height, auto); z-index: var(--z-panel); background: var(--bg); overflow-y: auto;
      padding: calc(var(--safe-top) + var(--space-4)) var(--space-4) calc(var(--safe-bottom) + var(--space-4));
      touch-action: pan-y; }
    #mp header { display: flex; justify-content: space-between; align-items: center; max-width: 560px; margin: 0 auto var(--space-3); }
    #mp h2 { font-size: var(--fs-h2); }
    #mpContent { max-width: 560px; margin: 0 auto; display: grid; gap: var(--space-3); }
    #mpChoose { display: grid; gap: var(--space-3); justify-items: center; }
    #mpModeRow { display: flex; gap: var(--space-2); }
    #mpLevelList { display: grid; gap: var(--space-2); width: 100%; }
    #mpJoinRow { display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: center; }
    #mpCodeInput {
      background: var(--bg-panel);
      border: var(--border-strong);
      color: var(--text);
      border-radius: var(--radius-m);
      min-height: var(--touch-min);
      padding: 0 var(--space-3);
      font: 600 var(--fs-body) var(--font);
      letter-spacing: 2px;
      text-transform: uppercase;
      width: 150px;
      text-align: center;
    }
    #mpLobby { display: grid; gap: var(--space-3); justify-items: center; text-align: center; }
    #mpLobby h3 { font-size: var(--fs-body); }
    #mpQr { width: min(60vw, 260px); background: white; border-radius: var(--radius-l); padding: var(--space-3); }
    #mpQr svg { display: block; width: 100%; height: auto; }
    .mp-code { font: 700 26px var(--font); letter-spacing: 6px; color: var(--accent); }
    #scanner { position: fixed; inset: 0; height: var(--app-height, auto); z-index: var(--z-banner); background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3); }
    #scannerVideo { width: 100%; max-height: 70%; object-fit: cover; }
    #scannerHint { font-size: var(--fs-body-s); opacity: 0.8; }
    .level-item .level-meta { font-size: var(--fs-small); opacity: 0.8; color: var(--warning); white-space: nowrap; }

    /* --- Werkstatt (Bibliothek) --- */
    #workshop { position: fixed; inset: 0; height: var(--app-height, auto); z-index: var(--z-panel); background: var(--bg); overflow-y: auto;
      padding: calc(var(--safe-top) + var(--space-4)) var(--space-4) calc(var(--safe-bottom) + var(--space-4));
      touch-action: pan-y; }
    #workshop header { display: flex; justify-content: space-between; align-items: center; max-width: 560px; margin: 0 auto var(--space-3); }
    #workshop h2 { font-size: var(--fs-h2); }
    #workshopContent { max-width: 560px; margin: 0 auto; display: grid; gap: var(--space-3); }
    /* Aktionen als Modus-Karten (wie das Startmenü): Phone gestapelt,
       ab 900px als Drei-Spalten-Grid mit „Weiter an …" als Hero-Zeile. */
    #workshopActions { display: flex; flex-direction: column; gap: var(--space-2); }
    #workshopList { display: grid; gap: var(--space-3); }
    #wsEmpty { text-align: center; opacity: 0.6; padding: var(--space-5) 0; }
    @media (min-width: 900px) {
      #workshop header, #workshopContent { max-width: 760px; }
      #workshopActions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #wsResumeBtn { grid-column: 1 / -1; }
      #workshopList { align-items: start; }
    }
    /* NACH dem 900px-Block: erst hier ist eine Karte breit genug, dass
       Text-Buttons UND Icon-Aktionen ohne Umbruch in eine Zeile passen. */
    @media (min-width: 1200px) {
      #workshop header, #workshopContent { max-width: 1120px; }
      #workshopList { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    /* Bibliothek-Karte: Kopf (Name + Meta), darunter EINE Aktionszeile –
       zwei Text-Buttons links, die Icon-Aktionen rechts. Nichts bricht um:
       die Icon-Gruppe schrumpft nicht und die Zeile bleibt eine Zeile. */
    .ws-item { display: grid; gap: var(--space-3); padding: var(--space-3) 14px; container-type: inline-size; }
    .ws-head { display: grid; gap: 2px; }
    .ws-name { font-size: var(--fs-body); font-weight: 600; }
    .ws-meta { font-size: var(--fs-small); opacity: 0.55; }
    .ws-actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .ws-actions > .btn { flex: 0 1 auto; }
    /* Die Icon-Gruppe ist ein eigener Flex-Container: sie bricht als GANZES
       um, statt einzelne Icons in die nächste Zeile fallen zu lassen. */
    .ws-icons { display: flex; gap: var(--space-1); margin-left: auto; }
    .ws-icon { min-width: var(--touch-min); padding: 0 var(--space-2); }
    .ws-danger.armed { color: var(--warning); border-color: var(--warning); min-width: auto; }
    /* Entscheidend ist die KARTENbreite, nicht die des Fensters: dieselbe
       Karte steht auf dem Phone einspaltig und auf dem Tablet zweispaltig. */
    @container (max-width: 430px) {
      .ws-actions > .btn { flex: 1 1 0; }
      .ws-icons { margin-left: 0; flex-basis: 100%; justify-content: space-between; }
      .ws-icon { flex: 1 1 0; }
    }

    /* --- Editor: Dreispalter ab 900px, sonst Leisten --- */
    #editor {
      position: fixed; inset: 0; height: var(--app-height, auto);
      z-index: var(--z-panel); background: var(--bg);
      display: flex; flex-direction: column; gap: var(--space-2);
      padding: calc(var(--safe-top) + var(--space-3)) var(--space-3) calc(var(--safe-bottom) + var(--space-3));
    }
    #edHeader { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    #edName {
      flex: 1; min-width: 120px;
      background: var(--bg-panel); border: var(--border-strong); color: var(--text);
      border-radius: var(--radius-m); min-height: var(--touch-min);
      padding: 0 var(--space-3); font: 600 var(--fs-body) var(--font);
    }
    #edBadges { display: flex; gap: var(--space-1); flex-wrap: wrap; }
    #edHeaderBtns { display: flex; gap: var(--space-2); margin-left: auto; }
    #edStatus { min-height: 1.2em; text-align: center; }
    #edFloorRow { display: flex; align-items: center; gap: var(--space-2); }
    #edFloorTabs { display: flex; gap: var(--space-1); flex-wrap: wrap; }
    #edPlay { margin-left: auto; }
    /* Läuft die Vorschau, trägt der Knopf die Akzentfarbe – man sieht am
       Kopf, dass sich die Karte gerade von selbst bewegt. */
    #edPlay.active { color: var(--accent); border-color: rgba(75, 224, 200, 0.45); }
    #wsImportBox { display: grid; gap: var(--space-2); padding: var(--space-3); }
    #wsImportText {
      background: var(--bg-panel); border: var(--border-strong); color: var(--text);
      border-radius: var(--radius-m); padding: var(--space-2);
      font: 500 var(--fs-small) ui-monospace, monospace; resize: vertical;
    }
    #edBody { flex: 1; min-height: 0; display: grid; gap: var(--space-3); grid-template-columns: 200px minmax(0, 1fr) 250px; }
    #edPalette { overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-2); }
    #edCanvasWrap { position: relative; min-height: 0; border-radius: var(--radius-l); overflow: hidden; background: var(--bg-deep); }
    #edCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #edTools, #edElements { display: flex; flex-direction: column; gap: var(--space-2); }
    #edElementBtn { display: none; } /* nur Phone: öffnet das Element-Sheet */
    #edDrawer { min-height: 0; display: flex; flex-direction: column; }
    #edDrawerHead { display: none; } /* nur Phone: Griff + ✕ des Drawers */
    #edDrawerHandle { display: none; }
    /* Auswahl-Kopf: Galerie-Miniatur + Elementname – wer hier editiert,
       sieht sofort, WAS er editiert (auch im Phone-Drawer). */
    .ed-selhead { display: flex; align-items: center; gap: var(--space-2); }
    .ed-selhead canvas { width: 44px; height: 28px; border-radius: var(--radius-s); flex-shrink: 0; }
    #edProps { overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-3); flex: 1; min-height: 0; }
    @media (max-width: 899px) {
      /* Phone: das SPIELFELD dominiert. Oben nur eine kompakte Leiste
         (Werkzeug-Icons + Element-Button); die Element-Auswahl ist ein
         mehrspaltiges Grid-Sheet, die Eigenschaften ein Drawer am unteren
         Rand mit stets sichtbarem Griff – beides Overlays über der Karte,
         die ihr keine Höhe wegnehmen. */
      #edBody { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
      #edPalette { flex-direction: row; align-items: stretch; gap: var(--space-1); overflow: visible; }
      #edPalette .ed-group-label { display: none; }
      #edTools { flex-direction: row; gap: var(--space-1); }
      #edTools .ed-tile { justify-content: center; min-width: var(--touch-min); padding: var(--space-1); }
      #edTools .ed-lbl { display: none; } /* Icons genügen, Platz gehört der Karte */
      #edElementBtn { display: flex; flex: 1; min-width: 0; }
      #edElementBtn .ed-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #edElements {
        position: absolute; z-index: 3;
        left: var(--space-3); right: var(--space-3);
        bottom: calc(var(--safe-bottom) + var(--space-3));
        max-height: 60vh; overflow-y: auto;
        display: none;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-2); padding: var(--space-3);
        background: var(--bg-panel); border: var(--border-strong);
        border-radius: var(--radius-l); box-shadow: var(--shadow-raised);
      }
      #editor.sheet-open #edElements { display: grid; }
      #edElements .ed-tile { flex-direction: column; text-align: center; gap: var(--space-1); padding: var(--space-2); }
      #edDrawer {
        position: absolute; z-index: 2;
        left: var(--space-3); right: var(--space-3); bottom: var(--safe-bottom);
        max-height: 55vh;
        background: var(--bg-panel); border: var(--border-strong); border-bottom: none;
        border-radius: var(--radius-l) var(--radius-l) 0 0;
        box-shadow: var(--shadow-raised);
        transform: translateY(calc(100% - var(--touch-min)));
        transition: transform 0.2s ease;
      }
      #edDrawer.open { transform: none; }
      #edDrawerHead { display: flex; align-items: stretch; flex-shrink: 0; }
      #edDrawerHandle {
        display: flex; justify-content: center; align-items: center; gap: var(--space-2);
        flex: 1; min-width: 0; min-height: var(--touch-min);
        border: none; border-radius: var(--radius-l) 0 0 0;
      }
      #edDrawerHandle canvas { width: 44px; height: 28px; border-radius: var(--radius-s); flex-shrink: 0; }
      #edDrawerClose { border: none; border-radius: 0 var(--radius-l) 0 0; min-width: var(--touch-min); }
      #edProps { padding: var(--space-3) var(--space-3) var(--space-3); }
      /* Kompakter Kopf: Badges als EINZEILIGE Scroll-Leiste in eigener Zeile
         statt drei Umbruch-Zeilen; Buttons rutschen geordnet in Zeile 3. */
      #edBadges { order: 3; flex-basis: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
      #edBadges .ed-badge { flex: 0 0 auto; }
      #edHeaderBtns { order: 2; }
      #edName { min-width: 80px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #edDrawer { transition: none; }
    }
    .ed-tile {
      display: flex; align-items: center; gap: var(--space-2);
      color: var(--text); font-size: var(--fs-small); text-align: left;
      min-height: var(--touch-min); padding: var(--space-1) var(--space-2); cursor: pointer;
    }
    /* outline-offset nach INNEN: in scrollenden Leisten (overflow hidden)
       würde ein außen liegender Rahmen oben/unten beschnitten. */
    .ed-tile.active { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--radius-m); }
    /* Werkzeug hier nicht anwendbar (Start ab Ebene 2): gedämpft, aber
       anklickbar – der Tap erklärt, warum. Kein `disabled`: das nimmt dem
       Knopf Hover UND Fokus, und damit die Tooltip-Blase. */
    .ed-tile.off { opacity: 0.4; }
    .ed-tile canvas { width: 44px; height: 28px; border-radius: var(--radius-s); flex-shrink: 0; }
    .ed-group-label { font-size: var(--fs-caption); opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
    .ed-badge { font-size: var(--fs-caption); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); }
    .ed-badge.fail { border-color: var(--warning); color: var(--warning); }
    .ed-field { display: grid; gap: var(--space-1); }
    .ed-field label { font-size: var(--fs-caption); opacity: 0.6; }
    .ed-field input, .ed-field select, .ed-field textarea {
      background: var(--bg-panel); border: var(--border-strong); color: var(--text);
      border-radius: var(--radius-m); min-height: var(--touch-min);
      padding: var(--space-1) var(--space-2); font: 500 var(--fs-body-s) var(--font);
    }
    .ed-field textarea { min-height: 64px; resize: vertical; }
    /* Playlist der Jukebox: Häkchenliste in EINER Spalte, scrollbar – die
       Titelliste wächst, das Panel darf nicht mitwachsen. Die Ziffer vor dem
       Titel ist die ABSPIELFOLGE (Reihenfolge des Anhakens), nicht die
       Listenposition. */
    .ed-playlist {
      display: grid; gap: var(--space-1); max-height: 210px; overflow-y: auto;
      padding: var(--space-1); border: var(--border-strong); border-radius: var(--radius-m);
      background: var(--bg-panel);
    }
    .ed-track {
      display: flex; align-items: center; gap: var(--space-2);
      min-height: var(--touch-min); padding: 0 var(--space-1);
      font: 500 var(--fs-body-s) var(--font);
    }
    .ed-track input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--accent); }
    .ed-track span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ed-track .ed-order { flex: none; width: 1.4em; opacity: 0.55; font-variant-numeric: tabular-nums; }
    .ed-track .ed-embedded { flex: none; font-size: var(--fs-caption); opacity: 0.55; }
    .ed-track button { flex: none; min-height: 34px; padding: 0 var(--space-2); }
    .ed-row { display: flex; gap: var(--space-2); align-items: end; }
    .ed-row .ed-field { flex: 1; }
    .gallery-item { display: flex; align-items: flex-start; gap: 14px; }
    .gallery-item canvas { border-radius: var(--radius-s); flex-shrink: 0; width: 96px; height: auto; }
    .gallery-item > div { flex: 1; min-width: 0; }
    .gallery-item h3 { font-size: var(--fs-body); margin-bottom: var(--space-1); }
    .gallery-item p { font-size: var(--fs-small); opacity: 0.75; line-height: 1.45; }
    .gallery-item .btn { margin-top: var(--space-2); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <!-- Konfetti: eigene Ebene ÜBER dem Spielfeld, aber UNTER der
       Ergebnis-Karte – die Karte zieht über das fallende Papier auf und
       bleibt lesbar. Nie interaktiv. -->
  <canvas id="confetti"></canvas>

  <div id="hud" class="hidden">
    <span id="hudStats">
      <b id="timer" class="hud-chip"></b>
      <span id="floor" class="hud-chip"></span>
      <span id="pings" class="hud-chip"></span>
      <span id="gems" class="hud-chip"></span>
    </span>
    <span id="hudButtons">
      <button id="calibrateBtn" class="btn btn-ghost" data-i18n-title="hud.calibrate">⌖</button>
      <button id="debugBtn" class="btn btn-ghost hidden" data-i18n-title="hud.debug">👁</button>
      <button id="editBtn" class="btn btn-ghost hidden" data-i18n-title="hud.edit">✏️</button>
      <button id="homeBtn" class="btn btn-ghost" data-i18n-title="hud.home">🏠</button>
    </span>
  </div>
  <p id="status"></p>

  <div id="overlay">
    <h1>tiltr</h1>
    <p id="tagline" data-i18n-html="app.tagline"></p>
    <p id="headphones" data-i18n="app.headphones"></p>
    <div id="menuButtons">
      <div id="quickGroup" class="panel">
        <button id="quickBtn" class="btn btn-primary btn-lg">⚡ <span data-i18n="menu.quick">Schnelles Spiel</span></button>
        <div id="presetRow">
          <button class="btn chip" data-preset="easy" data-i18n="preset.easy">Leicht</button>
          <button class="btn chip" data-preset="normal" data-i18n="preset.normal">Mittel</button>
          <button class="btn chip" data-preset="hard" data-i18n="preset.hard">Schwer</button>
        </div>
        <p id="quickBest" class="menu-meta"></p>
      </div>
      <div id="modeList">
        <button id="dailyBtn" class="panel mode-item">
          <span class="mode-icon">📅</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="menu.daily">Tages-Challenge</span>
            <span class="mode-sub" id="dailyStatus"></span>
          </span>
        </button>
        <button id="campaignBtn" class="panel mode-item">
          <span class="mode-icon">🌍</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="menu.campaign">Kampagne</span>
            <span class="mode-sub" data-i18n="menu.campaign.sub"></span>
          </span>
          <span class="mode-meta" id="campaignStars"></span>
        </button>
        <button id="mpBtn" class="panel mode-item">
          <span class="mode-icon">👥</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="menu.mp">Multiplayer</span>
            <span class="mode-sub" data-i18n="menu.mp.sub"></span>
          </span>
        </button>
        <button id="tutorialBtn" class="panel mode-item">
          <span class="mode-icon">🎓</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="menu.tutorial">Tutorial</span>
            <span class="mode-sub" id="tutorialSub" data-i18n="menu.tutorial.sub"></span>
          </span>
          <span class="mode-meta" id="tutorialProgress"></span>
        </button>
        <button id="workshopBtn" class="panel mode-item">
          <span class="mode-icon">🛠</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="menu.workshop">Werkstatt</span>
            <span class="mode-sub" data-i18n="menu.workshop.sub"></span>
          </span>
          <span class="mode-meta" id="workshopCount"></span>
        </button>
        <button id="hearingBtn" class="panel mode-item">
          <span class="mode-icon">🎧</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="menu.hearing">Hörtest</span>
            <span class="mode-sub" data-i18n="menu.hearing.sub"></span>
          </span>
        </button>
        <button id="galleryLink" class="panel mode-item">
          <span class="mode-icon">🧩</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="menu.gallery">Element-Galerie</span>
            <span class="mode-sub" data-i18n="menu.gallery.sub"></span>
          </span>
        </button>
      </div>
    </div>
    <div id="menuFooter">
      <input id="playerName" type="text" maxlength="24" autocomplete="nickname" spellcheck="false" data-i18n-ph="menu.namePh">
      <div id="controlsRow">
        <button class="btn chip" data-ctl="top" data-i18n="ctl.top">🥣 Draufsicht</button>
        <button class="btn chip" data-ctl="fp" data-i18n="ctl.fp">🧭 First Person</button>
      </div>
      <div id="langRow">
        <button class="btn chip" data-lang="de">DE</button>
        <button class="btn chip" data-lang="en">EN</button>
        <button class="btn chip" data-lang="fr">FR</button>
        <button class="btn chip" data-lang="es">ES</button>
      </div>
      <p id="sensorNote" data-i18n-html="app.sensorNote"></p>
      <p id="version"></p>
    </div>
  </div>

  <div id="splash">
    <div class="splash-stage">
      <div class="splash-ball"></div>
      <div class="splash-ring r1"></div>
      <div class="splash-ring r2"></div>
    </div>
    <h1 class="splash-logo">tiltr</h1>
    <p id="splashCredit"></p>
    <p id="splashVersion"></p>
  </div>

  <div id="interstitial" class="hidden">
    <div class="panel inter-card">
      <h2 id="interTitle"></h2>
      <p id="interText"></p>
      <!-- Leise Zusatzaktion (Duell herausfordern/Revanche): schließt die
           Karte NICHT, man teilt und entscheidet dann weiter. -->
      <button id="interExtra" class="btn btn-soft hidden"></button>
      <div class="inter-buttons">
        <button id="interSecondary" class="btn btn-ghost hidden"></button>
        <button id="interPrimary" class="btn btn-primary hidden"></button>
      </div>
    </div>
  </div>

  <div id="gallery" class="hidden">
    <header>
      <h2>🧩 <span data-i18n="menu.gallery">Element-Galerie</span></h2>
      <button id="galleryClose" class="btn btn-ghost" data-i18n="common.close">Schließen</button>
    </header>
    <div id="galleryList"></div>
  </div>

  <div id="hearing" class="hidden">
    <header>
      <h2 data-i18n="hear.title">🎧 Hörtest</h2>
      <button id="hearClose" class="btn btn-ghost" data-i18n="common.close">Schließen</button>
    </header>
    <div id="hearContent">
      <p id="hearIntro" data-i18n="hear.intro"></p>
      <p id="hearStatus"></p>
      <div id="hearGrid"></div>
      <div id="hearResult" class="hidden"></div>
      <button id="hearRestart" class="btn btn-ghost" data-i18n="hear.restart">⟳ Neuer Durchgang</button>
    </div>
  </div>

  <div id="campaign" class="hidden">
    <header>
      <h2>🌍 <span data-i18n="menu.campaign">Kampagne</span></h2>
      <button id="campaignClose" class="btn btn-ghost" data-i18n="common.close">Schließen</button>
    </header>
    <div id="campaignList"></div>
  </div>

  <div id="mp" class="hidden">
    <header>
      <h2>👥 <span data-i18n="menu.mp">Multiplayer</span></h2>
      <button id="mpClose" class="btn btn-ghost" data-i18n="common.close">Schließen</button>
    </header>
    <div id="mpContent">
      <div id="mpChoose">
        <p class="menu-label" data-i18n="mp.mode">Modus</p>
        <div id="mpModeRow">
          <button class="btn chip active" data-mpmode="coop" data-i18n="mp.coop">🤝 Coop</button>
          <button class="btn chip" data-mpmode="race" data-i18n="mp.race">🏁 Race</button>
        </div>
        <p id="mpModeHint" class="menu-meta"></p>
        <p class="menu-label" data-i18n="mp.pickLevel">Level wählen = Raum eröffnen</p>
        <div id="mpLevelList"></div>
        <p class="menu-label" data-i18n="mp.orJoin">Oder einem Raum beitreten</p>
        <div id="mpJoinRow">
          <input id="mpCodeInput" type="text" inputmode="latin" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="10" data-i18n-ph="mp.code" placeholder="RAUMCODE">
          <button id="mpJoinBtn" class="btn btn-primary" data-i18n="mp.join">Beitreten</button>
          <button id="mpScanBtn" class="btn btn-ghost" data-i18n="mp.scan">📷 Scannen</button>
        </div>
      </div>
      <div id="mpLobby" class="hidden">
        <h3 id="mpLobbyTitle"></h3>
        <div id="mpQr"></div>
        <p id="mpCode" class="mp-code"></p>
        <p id="mpLobbyStatus" class="menu-meta"></p>
        <button id="mpCancelBtn" class="btn btn-ghost" data-i18n="common.cancel">Abbrechen</button>
      </div>
    </div>
  </div>

  <div id="workshop" class="hidden">
    <header>
      <h2>🛠 <span data-i18n="menu.workshop">Werkstatt</span></h2>
      <button id="workshopClose" class="btn btn-ghost" data-i18n="common.close">Schließen</button>
    </header>
    <div id="workshopContent">
      <div id="workshopActions">
        <button id="wsResumeBtn" class="panel mode-item suggest hidden">
          <span class="mode-icon">✏️</span>
          <span class="mode-text">
            <span class="mode-title" id="wsResumeTitle"></span>
            <span class="mode-sub" id="wsResumeMeta"></span>
          </span>
        </button>
        <button id="wsNewBtn" class="panel mode-item">
          <span class="mode-icon">＋</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="ed.new">Neues Level</span>
            <span class="mode-sub" data-i18n="ws.new.sub">Leeres Raster, alles selbst bauen</span>
          </span>
        </button>
        <button id="wsNewRandomBtn" class="panel mode-item">
          <span class="mode-icon">🎲</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="ed.newRandom">Aus Zufallslevel</span>
            <span class="mode-sub" data-i18n="ws.random.sub">Quick-Generator als Grundgerüst</span>
          </span>
        </button>
        <button id="wsImportBtn" class="panel mode-item">
          <span class="mode-icon">⇪</span>
          <span class="mode-text">
            <span class="mode-title" data-i18n="ed.import">Importieren</span>
            <span class="mode-sub" data-i18n="ws.import.sub">Datei oder eingefügter Text</span>
          </span>
        </button>
      </div>
      <div id="wsImportBox" class="panel hidden">
        <textarea id="wsImportText" rows="4" data-i18n-ph="ed.importPh" spellcheck="false"></textarea>
        <div class="ws-actions">
          <button id="wsImportFile" class="btn btn-ghost" data-i18n="ed.importFile">📄 Datei wählen</button>
          <button id="wsImportGo" class="btn btn-primary" data-i18n="ed.importGo">Übernehmen</button>
        </div>
        <p id="wsImportStatus" class="menu-meta"></p>
        <input id="wsImportInput" type="file" accept=".json,application/json" class="hidden">
      </div>
      <p id="wsEmpty" class="menu-meta hidden" data-i18n="ed.empty"></p>
      <div id="workshopList"></div>
    </div>
  </div>

  <!-- Editor: Tablet-first-Dreispalter (Palette / Canvas / Eigenschaften);
       unter 900px werden daraus Leisten (Layout: theme.css). -->
  <div id="editor" class="hidden">
    <header id="edHeader">
      <button id="edClose" class="btn btn-ghost tip-below" data-i18n-tip="ed.back">‹</button>
      <input id="edName" type="text" maxlength="40" autocomplete="off" spellcheck="false" data-i18n-ph="ed.namePh">
      <span id="edBadges"></span>
      <span id="edHeaderBtns">
        <button id="edShare" class="btn btn-ghost tip-below" data-i18n-tip="ed.share">🔗</button>
        <button id="edExport" class="btn btn-ghost tip-below" data-i18n-tip="ed.export">⇩</button>
        <button id="edTest" class="btn btn-ghost" data-i18n="ed.test">▶ Testen</button>
        <button id="edSave" class="btn btn-primary" data-i18n="ed.save">Speichern</button>
      </span>
    </header>
    <p id="edStatus" class="menu-meta"></p>
    <div id="edFloorRow">
      <span id="edFloorTabs"></span>
      <button id="edPlay" class="btn btn-ghost tip-below" data-i18n-tip="ed.animate">▶</button>
      <button id="edFit" class="btn btn-ghost tip-below" data-i18n-tip="ed.fit">⤢</button>
    </div>
    <div id="edBody">
      <div id="edPalette"></div>
      <div id="edCanvasWrap"><canvas id="edCanvas"></canvas></div>
      <div id="edDrawer">
        <div id="edDrawerHead">
          <button id="edDrawerHandle" class="btn btn-ghost"></button>
          <button id="edDrawerClose" class="btn btn-ghost" data-i18n-tip="common.close">✕</button>
        </div>
        <div id="edProps"></div>
      </div>
    </div>
  </div>

  <div id="scanner" class="hidden">
    <video id="scannerVideo" playsinline muted></video>
    <div id="scannerHint" data-i18n="mp.scanHint">QR-Code des Raums vor die Kamera halten</div>
    <button id="scannerClose" class="btn btn-ghost" data-i18n="common.cancel">Abbrechen</button>
  </div>

  <div id="banners">
    <div id="installHint" class="banner hidden">
      <span id="installLabel"></span>
      <span class="banner-buttons">
        <button id="installBtn" class="btn btn-primary hidden" data-i18n="inst.button">Installieren</button>
        <button id="installDismiss" class="btn btn-ghost" data-i18n-title="common.close">✕</button>
      </span>
    </div>
    <div id="updateToast" class="banner hidden">
      <span id="updateLabel" data-i18n="upd.available">Neue Version verfügbar</span>
      <button id="updateBtn" class="btn btn-primary" data-i18n="upd.button">Aktualisieren</button>
    </div>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
